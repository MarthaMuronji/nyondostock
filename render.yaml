services:
  - type: web
    name: nyondo-stock-hardware
    runtime: python
    plan: free
    region: frankfurt
    # manage.py and the package are at the repo root, so no rootDir is needed.
    buildCommand: bash build.sh
    startCommand: gunicorn nyondoproject.wsgi:application --bind 0.0.0.0:$PORT --log-file -
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        sync: false
